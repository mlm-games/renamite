name: Release (publish crates + editor binaries)

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type."
        required: true
        default: "patch"
        type: choice
        options:
          - none
          - patch
          - minor
          - major
      mark_prerelease:
        description: "Mark as prerelease"
        required: true
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    uses: mlm-games/ci/.github/workflows/crate-publish.yml@v1
    with:
      working-directory: .
      workspace-publish: true
      bump-type: ${{ inputs.bump_type }}
      create-release: false
      generate-release-notes: false
      system-deps: libasound2-dev libudev-dev pkg-config libx11-dev libxcb1-dev libxi-dev libxinerama-dev libxrandr-dev libxcursor-dev libfontconfig-dev libwayland-dev libxkbcommon-dev
      dispatch-on-release: '["release.yml"]'
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}