name: GPU Export CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: gpu-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gpu-export:
    name: Repose WGPU exporter (llvmpipe)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies + Mesa software Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev pkg-config libx11-dev libxcb1-dev libxi-dev \
            libxinerama-dev libxrandr-dev libxcursor-dev libfontconfig-dev \
            libwayland-dev libxkbcommon-dev mesa-vulkan-drivers

      - uses: Swatinem/rust-cache@v2

      - name: Test offscreen renderer
        run: |
          cargo test -p renamite-render-offscreen
          cargo test -p renamite-render-offscreen -- --ignored

      - name: Template render smoke (CLI)
        run: |
          cargo build -p renamite-cli
          mkdir -p template-render
          for t in blank bouncing-ball loader-trim-path masked-text photo-card repeater-burst gradient-poster; do
            ren="$PWD/template-render/$t.ren"
            ./target/debug/renamite new "$ren" --template "$t"
            ./target/debug/renamite render "$ren" --frame 0 --out "template-render/$t.png" --background white
            magic=$(od -An -tx1 -N8 "template-render/$t.png" | tr -d ' \n')
            test "$magic" = "89504e470d0a1a0a" || { echo "$t produced an invalid PNG (magic=$magic)"; exit 1; }
          done

      - name: Deep-validate built-in templates
        run: |
          for t in blank bouncing-ball loader-trim-path masked-text photo-card repeater-burst gradient-poster; do
            ./target/debug/renamite validate "$PWD/template-render/$t.ren" --deep
          done

      - name: upload golden diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-actuals
          path: crates/renamite-render-offscreen/tests/goldens/*.actual.png
          if-no-files-found: ignore
