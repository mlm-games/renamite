name: Release Editor Binaries

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version to build (informational; rust-app-release reads Cargo.toml)"
        required: false
        type: string
      mark_prerelease:
        description: "Mark as prerelease"
        required: false
        default: false
        type: boolean
      play_track:
        description: "Google Play track"
        required: true
        default: "none"
        type: choice
        options:
          - none
          - internal
          - alpha
          - beta
          - production

concurrency:
  group: release-editor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: mlm-games/ci/.github/workflows/rust-app-release.yml@v1
    with:
      working-directory: apps/renamite-editor
      app-name: "renamite"
      app-slug: "renamite"
      bin-name: "renamite-desktop"
      # crate-publish already bumped + tagged; build the editor at that version.
      bump-type: none
      include-android: true
      include-universal: true
      play-track: ${{ inputs.play_track }}
      play-package-name: "org.mlm.renamite"
      android-api: "37.0"
      android-build-tools: "37.0.0"
      android-ndk-version: "29.0.14206865"
      cargo-rapk-version: "0.20.1"
      java-version: "21"
      java-distribution: "temurin"
      kotlin-version: "2.2.10"
      prerelease: ${{ inputs.mark_prerelease }}
      generate-release-notes: true
      changelog-path: "CHANGELOG.md"
    secrets: inherit