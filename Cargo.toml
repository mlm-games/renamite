[workspace]
resolver = "3"
members = ["apps/renamite-editor", "apps/renamite-cli", "crates/*"]

[workspace.package]
version = "0.3.13"
edition = "2024"
rust-version = "1.98"
license = "MPL-2.0"
repository = "https://github.com/mlm-games/renamite"

[workspace.dependencies]

repose-core = "0.31"
repose-ui = "0.31"
repose-material = "0.31"
repose-canvas = "0.31"
repose-docking = "0.31"
repose-platform = "0.31"
repose-render-wgpu = { version = "0.31", default-features = false }
repose-text = "0.31"

game-utils = "0.4"

kurbo = { version = "0.13", features = ["serde"] }
glam = { version = "0.33", default-features = false, features = [
    "std",
    "serde",
    "f64",
] }
lyon_tessellation = "1.0.20"
lyon_path = "1.0"
linesweeper = "0.4"
wgpu = { version = "30", features = ["webgpu", "webgl"] }

usvg = { version = "0.48", default-features = false, features = ["text"] }


serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
ron = "0.12"
postcard = { version = "1.1.3", default-features = false, features = [
    "use-std",
] }
slotmap = { version = "1.1", features = ["serde"] }
smallvec = "1.15"
proptest = "1"
thiserror = "2"
anyhow = "1"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
] }
base64 = "0.22"
rustc-hash = "2.1"
log = "0.4"

rlobkit-dialogs = "0.6"
rlobkit-app-events = "0.6"
web-workers = "0.3"

env_logger = "0.11"
futures-lite = "2"
web-time = "1.1"
directories = "6"
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }
winit = "0.30"

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", default-features = false, features = ["console"] }
console_error_panic_hook = "0.1"

clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
pollster = "0.4"
tempfile = "3"

renamite-animation = { path = "crates/renamite-animation", version = "0.3.13" }
renamite-geometry = { path = "crates/renamite-geometry", version = "0.3.13" }
renamite-text = { path = "crates/renamite-text", version = "0.3.13" }
renamite-model = { path = "crates/renamite-model", version = "0.3.13" }
renamite-history = { path = "crates/renamite-history", version = "0.3.13" }
renamite-behavior-common = { path = "crates/renamite-behavior-common", version = "0.3.13" }
renamite-behavior-canvas = { path = "crates/renamite-behavior-canvas", version = "0.3.13" }
renamite-behavior-timeline = { path = "crates/renamite-behavior-timeline", version = "0.3.13" }
renamite-render-bridge = { path = "crates/renamite-render-bridge", version = "0.3.13" }
renamite-render-offscreen = { path = "crates/renamite-render-offscreen", version = "0.3.13" }
renamite-ui = { path = "crates/renamite-ui", version = "0.3.13" }
renamite-platform = { path = "crates/renamite-platform", version = "0.3.13" }
renamite-io-lottie = { path = "crates/renamite-io-lottie", version = "0.3.13" }
renamite-io-svg = { path = "crates/renamite-io-svg", version = "0.3.13" }
renamite-test-support = { path = "crates/renamite-test-support", version = "0.3.13" }
renamite-machine = { path = "crates/renamite-machine", version = "0.3.13" }
renamite-io-ren = { path = "crates/renamite-io-ren", version = "0.3.13" }
renamite-validate = { path = "crates/renamite-validate", version = "0.3.13" }
renamite-examples = { path = "crates/renamite-examples", version = "0.3.13" }
renamite-player = { path = "crates/renamite-player", version = "0.3.13" }
renamite-mcp = { path = "crates/renamite-mcp", version = "0.3.13" }
renamite-player-ui = { path = "crates/renamite-player-ui", version = "0.3.13" }

