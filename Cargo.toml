[workspace]
resolver = "3"
members = ["apps/renamite-editor", "apps/renamite-cli", "crates/*"]

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.93"
license = "MPL-2.0"
repository = "https://github.com/mlm-games/renamite"

[workspace.dependencies]

repose-core = "0.28"
repose-ui = "0.28"
repose-material = "0.28"
repose-canvas = "0.28"
repose-docking = "0.28"
repose-platform = "0.28"
repose-render-wgpu = { version = "0.28", default-features = false }
repose-text = "0.28"
repose-app = "0.28"
repose-tree = "0.28"


kurbo = { version = "0.13", features = ["serde"] }
glam = { version = "0.33", default-features = false, features = [
    "std",
    "serde",
    "f64",
] }
lyon_tessellation = "1.0.20"
lyon_path = "1.0"
linesweeper = "0.4"
wgpu = { version = "30", features = ["webgpu", "webgl"] }
ttf-parser = "0.25"

# CI/reference only
vello = { version = "0.9" }
velato = { version = "0.11" }
usvg = { version = "0.48", default-features = false, features = ["text"] }
resvg = { version = "0.48" }


serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
ron = "0.12"
postcard = { version = "1.1.3", default-features = false, features = [
    "use-std",
] }
slotmap = { version = "1.1", features = ["serde"] }
smallvec = "1.15"
proptest = "1"
thiserror = "2"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
base64 = "0.22"
tracing = "0.1"
bytemuck = { version = "1.25", features = ["derive"] }
rustc-hash = "2.1"
log = "0.4"
bitflags = { version = "2", features = ["serde"] }

rlobkit-dialogs = "0.5"
web-workers = "0.3"

clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
pollster = "0.4"
tempfile = "3"

renamite-animation = { path = "crates/renamite-animation", version = "0.2.2" }
renamite-geometry = { path = "crates/renamite-geometry", version = "0.2.2" }
renamite-text = { path = "crates/renamite-text", version = "0.2.2" }
renamite-model = { path = "crates/renamite-model", version = "0.2.2" }
renamite-history = { path = "crates/renamite-history", version = "0.2.2" }
renamite-behavior-common = { path = "crates/renamite-behavior-common", version = "0.2.2" }
renamite-behavior-canvas = { path = "crates/renamite-behavior-canvas", version = "0.2.2" }
renamite-behavior-timeline = { path = "crates/renamite-behavior-timeline", version = "0.2.2" }
renamite-render-bridge = { path = "crates/renamite-render-bridge", version = "0.2.2" }
renamite-render-offscreen = { path = "crates/renamite-render-offscreen", version = "0.2.2" }
renamite-ui = { path = "crates/renamite-ui", version = "0.2.2" }
renamite-platform = { path = "crates/renamite-platform", version = "0.2.2" }
renamite-io-lottie = { path = "crates/renamite-io-lottie", version = "0.2.2" }
renamite-io-svg = { path = "crates/renamite-io-svg", version = "0.2.2" }
renamite-test-support = { path = "crates/renamite-test-support", version = "0.2.2" }
renamite-machine = { path = "crates/renamite-machine", version = "0.2.2" }
renamite-io-ren = { path = "crates/renamite-io-ren", version = "0.2.2" }
renamite-validate = { path = "crates/renamite-validate", version = "0.2.2" }
renamite-examples = { path = "crates/renamite-examples", version = "0.2.2" }
renamite-player = { path = "crates/renamite-player", version = "0.2.2" }
renamite-player-ui = { path = "crates/renamite-player-ui", version = "0.2.2" }

