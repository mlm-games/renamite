[package]
name = "renamite-io-lottie"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Lottie (.json / .tgs) import and export for renamite."

[dependencies]
renamite-model = { path = "../renamite-model" }
renamite-animation = { path = "../renamite-animation" }
