[package]
name = "renamite-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Files and autosave backends for renamite (desktop + mobile/web)."

[dependencies]
rlobkit-dialogs.workspace = true
game-utils.workspace = true
log.workspace = true
futures-lite.workspace = true
