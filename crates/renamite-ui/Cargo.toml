[package]
name = "renamite-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Editor chrome for renamite, built on Repose."

[dependencies]
repose-core.workspace = true
repose-ui.workspace = true
repose-material.workspace = true
repose-docking.workspace = true
repose-canvas.workspace = true
repose-platform.workspace = true
renamite-behavior-common.workspace = true
renamite-behavior-canvas.workspace = true
renamite-behavior-timeline.workspace = true
renamite-geometry.workspace = true
renamite-model.workspace = true
renamite-history.workspace = true
renamite-animation.workspace = true
renamite-player.workspace = true
renamite-io-ren = { workspace = true, features = ["binary"] }
renamite-io-lottie.workspace = true
renamite-io-svg.workspace = true
renamite-examples.workspace = true
renamite-machine.workspace = true
renamite-render-bridge.workspace = true
renamite-platform.workspace = true
renamite-render-offscreen.workspace = true
renamite-text.workspace = true
web-workers.workspace = true
glam.workspace = true
kurbo.workspace = true
smallvec.workspace = true
slotmap.workspace = true
anyhow.workspace = true
serde_json.workspace = true
web-time = "1.1"
image.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", default-features = false, features = ["console"] }
