[package]
name = "renamite-editor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "renamite desktop + web runner"

[[bin]]
name = "renamite"
path = "src/main.rs"

[dependencies]
repose-platform.workspace = true
repose-app.workspace = true
repose-core.workspace = true
renamite-ui = { path = "../../crates/renamite-ui" }
renamite-platform = { path = "../../crates/renamite-platform", features = ["native"] }
renamite-model = { path = "../../crates/renamite-model" }
tracing.workspace = true
serde_json.workspace = true