[package]
name = "renamite-editor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "renamite multiplatform editor runner"
default-run = "renamite-desktop"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "renamite-desktop"
path = "src/main.rs"

[dependencies]
repose-platform.workspace = true
repose-core.workspace = true
renamite-ui.workspace = true
anyhow.workspace = true
env_logger = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
log = "0.4"
winit = "0.30"
